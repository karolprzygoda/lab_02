name: lab_02

x-app: &app
  build:
    context: ..
    dockerfile: Docker/Dockerfile
  environment:
    DATABASE_URL: postgresql://postgres:postgres@db:5432/notifications
  restart: unless-stopped

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notifications
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notifications"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    <<: *app
    command: ["pnpm", "db:deploy"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
  web:
    <<: *app
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  email:
    <<: *app
    command: ["pnpm", "worker:email"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  push:
    <<: *app
    command: ["pnpm", "worker:push"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
